{% extends "base.html" %}
{% block title %}登录 · 表情轨迹标注{% endblock %}
{% block content %}
<section class="login-card">
  <div class="login-mark" aria-hidden="true">16</div>
  <h1>开始标注</h1>
  <p>请输入研究协调者提供的访问码。</p>
  <form method="post" class="login-form">
    <label for="code">访问码</label>
    <input id="code" name="code" autocomplete="off" autofocus required>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <button class="primary" type="submit">进入任务</button>
  </form>
</section>
{% endblock %}
